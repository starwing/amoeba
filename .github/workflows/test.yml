# CI for amoeba.
#
# The suites are driven by just (`just test`, `just test-release`, ...); see
# justfile and tests/justfile.  Every check builds the generated entry tables
# with misc/gen_entries.lua, so Lua is a build dependency of the tests.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  checks:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      LUA: lua5.4
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev lcov clang-format
          lua5.4 -v
          clang-format --version

      - uses: extractions/setup-just@v2

      - name: Build + run every suite (ASan/UBSan)
        run: just test

      - name: Optimised build (-O2, no sanitizers)
        run: just test-release

      - name: Double precision
        run: just test-double

      - name: Clean C (C89) compile check
        run: just test-c89

      - name: C++03 compile check
        run: just test-cpp03

      - name: Lua binding
        run: just test-lua

      # Advisory for now: the formatting baseline is clang-format >= 19 (the
      # config uses newer keys) and the distro package may be older than the
      # one used locally.  Flip continue-on-error once the version is pinned
      # in both places (see TODO.md).
      - name: clang-format check (advisory)
        continue-on-error: true
        run: just format-check

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      LUA: lua5.4
      CC: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lcov
          sudo apt-get install -y libperlio-gzip-perl libjson-perl \
            libcapture-tiny-perl libdatetime-perl

      - uses: extractions/setup-just@v2

      - name: Collect coverage
        run: just cov

      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: tests/build/amoeba.info
          parallel: true

  finish:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
