# CI for amoeba.
#
# The suites are driven by just (`just test`, `just test-release`, ...); see
# justfile and tests/justfile.  Every check builds the generated entry tables
# with misc/gen_entries.lua, so Lua is a build dependency of the tests.
#
# clang-format is installed through pipx at a pinned version: the runner image
# ships clang-format 18, but .clang-format uses keys from 19+, and 18 rejects
# them.  Bump the pin together with the local baseline.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  checks:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      LUA: lua5.4
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev lcov
          pipx install clang-format==23.1.5
          pipx_bin="$(pipx environment --value PIPX_BIN_DIR)"
          echo "CLANG_FORMAT=$pipx_bin/clang-format" >> "$GITHUB_ENV"
          lua5.4 -v
          "$pipx_bin/clang-format" --version

      - uses: extractions/setup-just@v4

      - name: Build + run every suite (ASan/UBSan)
        run: just test

      - name: Optimised build (-O2, no sanitizers)
        run: just test-release

      - name: Double precision
        run: just test-double

      - name: Clean C (C89) compile check
        run: just test-c89

      - name: C++03 compile check
        run: just test-cpp03

      - name: Lua binding
        run: just test-lua

      - name: clang-format check
        run: just format-check

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      LUA: lua5.4
      CC: gcc
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lcov
          sudo apt-get install -y libperlio-gzip-perl libjson-perl \
            libcapture-tiny-perl libdatetime-perl

      - uses: extractions/setup-just@v4

      - name: Collect coverage
        run: just cov

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: tests/build/amoeba.info
          parallel: true

  finish:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
